<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRACKERPRO</title>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; margin: 0; padding: 20px; text-align: center; }
        .container { max-width: 400px; margin: auto; }
        .logo { font-size: 1.5rem; font-weight: bold; margin-bottom: 20px; }
        .logo span { color: #0070f3; }
        #map-view { width: 100%; height: 300px; background: #111; border: 1px solid #333; border-radius: 12px; margin-bottom: 20px; overflow: hidden; }
        iframe { width: 100%; height: 100%; border: none; }
        .info { background: #111; padding: 15px; border-radius: 12px; border: 1px solid #333; margin-bottom: 20px; text-align: left; }
        .label { color: #666; font-size: 0.7rem; font-weight: bold; }
        .val { font-family: monospace; font-size: 1.1rem; margin-bottom: 10px; display: block; }
        .btn { background: #0070f3; color: #fff; border: none; padding: 20px; width: 100%; border-radius: 12px; font-weight: bold; font-size: 1rem; cursor: pointer; text-transform: uppercase; }
        .btn:disabled { background: #333; }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo">TRACKER<span>PRO</span></div>
        <div id="status" style="font-size: 0.7rem; color: #555; margin-bottom: 10px;">SINAL: BUSCANDO...</div>

        <div id="map-view"></div>

        <div class="info">
            <span class="label">LATITUDE</span>
            <span id="lat" class="val">0.000000</span>
            <span class="label">LONGITUDE</span>
            <span id="lng" class="val">0.000000</span>
            <span class="label">SINCRONIZAÇÃO</span>
            <span id="sync" class="val">--:--:--</span>
        </div>

        <button id="btn-send" class="btn">ENVIAR FOTO PARA O DRIVE</button>
    </div>

    <script>
        // SUBSTITUA PELA URL DO NOVO DEPLOY (/exec)
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzkRRnN2xPZkKLW6QZD8Si0HVpyIIqO95qKxVffCxD71_jeCiHXfk6V1Lo-2ub_eCC7NA/exec";
        let lastLat, lastLng;

        navigator.geolocation.watchPosition(p => {
            lastLat = p.coords.latitude;
            lastLng = p.coords.longitude;
            document.getElementById('lat').innerText = lastLat.toFixed(6);
            document.getElementById('lng').innerText = lastLng.toFixed(6);
            document.getElementById('status').innerText = "SINAL: ONLINE";
            document.getElementById('status').style.color = "#00ff00";

            if (!document.querySelector('iframe')) {
                const embed = `https://maps.google.com/maps?q=${lastLat},${lastLng}&z=17&output=embed`;
                document.getElementById('map-view').innerHTML = `<iframe src="${embed}"></iframe>`;
            }
        }, null, { enableHighAccuracy: true });

        document.getElementById('btn-send').onclick = async function() {
            if (!lastLat) return alert("GPS não fixado.");
            
            this.innerText = "ENVIANDO...";
            this.disabled = true;

            try {
                // 'no-cors' para garantir que o envio ocorra sem bloqueios de segurança
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    body: JSON.stringify({ lat: lastLat, lng: lastLng })
                });
                
                document.getElementById('sync').innerText = new Date().toLocaleTimeString();
                alert("Enviado com sucesso!");
            } catch (e) {
                alert("Erro de conexão.");
            } finally {
                this.innerText = "ENVIAR FOTO PARA O DRIVE";
                this.disabled = false;
            }
        };
    </script>
</body>
</html>
