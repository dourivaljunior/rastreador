<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TESTE DRIVE</title>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .btn { background: #238636; color: #fff; border: none; padding: 30px 60px; border-radius: 10px; font-size: 1.5rem; font-weight: bold; cursor: pointer; border: 2px solid #30363d; }
        .btn:active { background: #2ea043; }
    </style>
</head>
<body>

    <button id="btn-teste" class="btn">CRIAR PASTA NO DRIVE</button>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxtKvOZ_W__eoyBDUJYUxlZi0vd2KcktSJxg2OEp5HKbmQyfkFJfoHb6TDvhpvymQrd/exec";

        document.getElementById('btn-teste').onclick = async function() {
            this.innerText = "PROCESSANDO...";
            this.style.opacity = "0.5";

            try {
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    body: JSON.stringify({acao: "criar_pasta"})
                });
                alert("Comando enviado! Verifique o Google Drive.");
            } catch (e) {
                alert("Erro na requisição.");
            } finally {
                this.innerText = "CRIAR PASTA NO DRIVE";
                this.style.opacity = "1";
            }
        };
    </script>
</body>
</html>
