<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TESTE DRIVE</title>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .btn { background: #238636; color: #fff; border: none; padding: 30px 60px; border-radius: 10px; font-size: 1.5rem; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <button id="btn-teste" class="btn">CRIAR/ABRIR PASTA</button>

    <script>
        // REDEPLOY O SCRIPT E COLE A NOVA URL AQUI
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxAGp5kb7JujQxjBzv3XclaV-WQpqi8ObTPSW-4XJcRc-iSYgpkTrdaPBYoh0BCdXmWUQ/exec";

        document.getElementById('btn-teste').onclick = async function() {
            this.innerText = "PROCESSANDO...";
            
            try {
                // O segredo do sucesso é o no-cors aqui para não dar erro de servidor
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    body: JSON.stringify({acao: "abrir"})
                });

                // Como no-cors não lê a resposta, redirecionamos para a raiz que já temos
                alert("Comando enviado! Abrindo pasta raiz...");
                window.location.href = "https://drive.google.com/drive/folders/1IK3IHvuCTOwBwxKX2skZKtXyQGR5IRN9";

            } catch (e) {
                alert("Falha na comunicação com o servidor.");
            } finally {
                this.innerText = "CRIAR/ABRIR PASTA";
            }
        };
    </script>
</body>
</html>
