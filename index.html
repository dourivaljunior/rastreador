<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>TrackerPro - GPS</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0f172a; color: white; margin: 0; padding: 15px; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 420px; background: #1e293b; padding: 15px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.4); }
        #map-display { width: 100%; height: 350px; border-radius: 12px; border: 2px solid #3b82f6; overflow: hidden; background: #000; margin-bottom: 10px; }
        iframe { width: 100%; height: 100%; border: none; }
        button { border: none; padding: 20px; border-radius: 10px; font-weight: bold; cursor: pointer; color: white; font-size: 16px; transition: 0.2s; width: 100%; background: #f59e0b; }
        button:active { transform: scale(0.96); opacity: 0.8; }
        #status { font-size: 12px; color: #94a3b8; text-align: center; margin-top: 15px; min-height: 15px; }
    </style>
</head>
<body>

<div class="container">
    <div style="font-size: 1.5rem; font-weight: bold; margin-bottom: 15px; text-align: center;">TRACKER<span style="color:#3b82f6">PRO</span></div>

    <div id="map-display">
        <div style="text-align:center; padding-top:150px; color:#475569;">Buscando satélites...</div>
    </div>

    <button onclick="enviarLocalizacao()">📍 ENVIAR MAPA E ABRIR DRIVE</button>

    <div id="status">Iniciando GPS...</div>
</div>

<script>
    // URL DO SEU SCRIPT
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzURsi0KnaxRCO5HIj1XU1iR6AOFAs8PFGCQ8frgFX2EMYLSDCtPSPjq_7hrlOdgSFC/exec";
    const st = document.getElementById("status");
    const mapArea = document.getElementById("map-display");
    let lat, lng;

    function monitorarPosicao() {
        if (navigator.geolocation) {
            navigator.geolocation.watchPosition(p => {
                lat = p.coords.latitude;
                lng = p.coords.longitude;
                st.innerText = `GPS Online: ${lat.toFixed(5)}, ${lng.toFixed(5)}`;
                const urlMapa = `https://maps.google.com/maps?q=${lat},${lng}&z=17&output=embed`;
                mapArea.innerHTML = `<iframe src="${urlMapa}"></iframe>`;
            }, null, { enableHighAccuracy: true });
        }
    }

    async function enviarLocalizacao() {
        if(!lat) return alert("Aguarde o sinal do GPS!");
        
        st.innerText = "Enviando dados ao Drive...";
        const btn = document.querySelector("button");
        btn.disabled = true;

        try {
            // O uso de 'no-cors' impede o erro de comunicação do servidor
            await fetch(SCRIPT_URL, {
                method: "POST",
                mode: "no-cors",
                body: JSON.stringify({ latitude: lat, longitude: lng })
            });

            st.innerText = "✅ Sincronizado! Abrindo Drive...";
            
            // Abre a pasta raiz onde as subpastas diárias são criadas
            setTimeout(() => {
                window.location.href = "https://drive.google.com/drive/folders/1IK3IHvuCTOwBwxKX2skZKtXyQGR5IRN9";
            }, 1000);

        } catch (e) {
            alert("Erro na conexão. Verifique a internet.");
        } finally {
            btn.disabled = false;
        }
    }

    monitorarPosicao();
</script>
</body>
</html>
