<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GERADOR DE PASTA</title>
    <style>
        body { 
            background: #000; 
            color: #fff; 
            font-family: sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
        }
        .btn { 
            background: #238636; 
            color: #fff; 
            border: none; 
            padding: 25px 50px; 
            border-radius: 10px; 
            font-size: 1.2rem; 
            font-weight: bold; 
            cursor: pointer; 
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <button id="executar" class="btn">GERAR PASTA NO DRIVE</button>

    <script>
        // COLE A URL DO SEU DEPLOY (/exec) ABAIXO
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxxE7RaLqYKc6yy_MJqfVp5WEgukcXbCTLhpcD-SniHM8Jah8qSVO8xqdbE9S0p3L5C/exec";

        document.getElementById('executar').onclick = async function() {
            this.innerText = "ENVIANDO...";
            
            try {
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    body: JSON.stringify({comando: "gerar_pasta"})
                });

                alert("Comando enviado com sucesso!");
            } catch (e) {
                alert("Erro de conexão.");
            } finally {
                this.innerText = "GERAR PASTA NO DRIVE";
            }
        };
    </script>
</body>
</html>
