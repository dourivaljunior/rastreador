<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GERADOR DE PASTA</title>
    <style>
        body { 
            background: #000; 
            color: #fff; 
            font-family: sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
        }
        .btn { 
            background: #238636; 
            color: #fff; 
            border: none; 
            padding: 30px 60px; 
            border-radius: 12px; 
            font-size: 1.5rem; 
            font-weight: bold; 
            cursor: pointer; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .btn:active { transform: scale(0.95); background: #2ea043; }
    </style>
</head>
<body>

    <button id="executar" class="btn">GERAR PASTA NO DRIVE</button>

    <script>
        // SUBSTITUA PELA SUA URL DE DEPLOY
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxHqn-8hadHExDW7VFnOdeJuB8_-ulw_IYZbp7vVm5LTpRTRfuUKsnkiX9yNMIJK5a9kQ/exec";

        document.getElementById('executar').onclick = async function() {
            const botao = this;
            botao.innerText = "CRIANDO...";
            botao.style.opacity = "0.5";
            
            try {
                // Enviando como 'text/plain' para evitar problemas de pré-vôo (CORS)
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'text/plain' },
                    body: JSON.stringify({acao: "criar_pasta_hoje"})
                });

                alert("Comando enviado! Verifique o Google Drive.");
            } catch (e) {
                alert("Falha ao contactar o servidor.");
            } finally {
                botao.innerText = "GERAR PASTA NO DRIVE";
                botao.style.opacity = "1";
            }
        };
    </script>
</body>
</html>
