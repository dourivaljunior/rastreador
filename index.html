<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRACKERPRO | Monitoramento</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-container">
        <header>
            <div class="logo">TRACKER<span>PRO</span></div>
            <div id="status" class="status-off">SINAL GPS: OFF</div>
        </header>

        <div id="map-display" class="map-box">
            <div class="msg">Aguardando sinal de satélite...</div>
        </div>

        <div class="telemetry">
            <div class="data-row">
                <span class="label">LATITUDE:</span>
                <span id="lat-val" class="val">0.000000</span>
            </div>
            <div class="data-row">
                <span class="label">LONGITUDE:</span>
                <span id="lng-val" class="val">0.000000</span>
            </div>
            <div class="data-row">
                <span class="label">HORÁRIO:</span>
                <span id="time-val" class="val">--:--:--</span>
            </div>
        </div>

        <button id="btn-send" class="btn-primary">ENVIAR FOTO PARA O DRIVE</button>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzoay8L9pyDogTA9uJMgQ84g1aVmZTjppfY6m9GZ37qc215oxw0ON4qqr3V33Sbz69P/exec"; 
        let lastLat, lastLng;

        // Monitoramento do GPS
        navigator.geolocation.watchPosition(p => {
            lastLat = p.coords.latitude;
            lastLng = p.coords.longitude;
            
            document.getElementById('lat-val').innerText = lastLat.toFixed(6);
            document.getElementById('lng-val').innerText = lastLng.toFixed(6);
            document.getElementById('status').innerText = "SINAL GPS: OK";
            document.getElementById('status').className = "status-on";

            // Atualiza o mapa estático na tela apenas na primeira vez
            if (!document.querySelector('iframe')) {
                const embed = `https://maps.google.com/maps?q=${lastLat},${lastLng}&z=17&output=embed`;
                document.getElementById('map-display').innerHTML = `<iframe src="${embed}"></iframe>`;
            }
        }, null, { enableHighAccuracy: true });

        // Envio da Foto
        document.getElementById('btn-send').onclick = async function() {
            if (!lastLat) return alert("Aguardando GPS...");
            
            const btn = this;
            btn.innerText = "ENVIANDO...";
            btn.disabled = true;

            try {
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    body: JSON.stringify({ lat: lastLat, lng: lastLng })
                });
                document.getElementById('time-val').innerText = new Date().toLocaleTimeString();
                alert("Foto enviada com sucesso!");
            } catch (e) {
                alert("Erro ao enviar.");
            } finally {
                btn.innerText = "ENVIAR FOTO PARA O DRIVE";
                btn.disabled = false;
            }
        };
    </script>
</body>
</html>
