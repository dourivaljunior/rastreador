<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GPS Tracker | Monitoramento</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-container">
        <header>
            <div class="status-indicator">
                <span id="dot" class="dot"></span>
                <span id="status-text">SISTEMA OFFLINE</span>
            </div>
            <h1>TRACKER<span>PRO</span></h1>
        </header>

        <div id="map-view" class="map-container">
            <div id="placeholder-text" style="padding: 100px 20px; text-align: center; color: #475569;">
                Aguardando autorização do GPS...
            </div>
        </div>

        <div class="telemetry-grid">
            <div class="stat-card">
                <label>LATITUDE</label>
                <div id="lat-val">0.000000</div>
            </div>
            <div class="stat-card">
                <label>LONGITUDE</label>
                <div id="lng-val">0.000000</div>
            </div>
            <div class="stat-card full">
                <label>ÚLTIMA SINCRONIZAÇÃO</label>
                <div id="time-val">--:--:--</div>
            </div>
        </div>

        <button id="btn-start" class="btn-main">ATIVAR RASTREAMENTO</button>
    </div>

    <script>
        // SUBSTITUA PELA SUA URL DO GOOGLE APPS SCRIPT
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzrpljaF_lTEVYz-9A_TtWpyFq9fQJnUxBGrKmq4xw19QHa2_6EwmsT2RsHC8Kix8H9/exec"; 
        
        let isTracking = false;
        let watchID = null;
        let lastLat = null;
        let lastLng = null;

        const btn = document.getElementById('btn-start');
        const dot = document.getElementById('dot');
        const statusText = document.getElementById('status-text');
        const timeVal = document.getElementById('time-val');

        // Função para atualizar o mapa na tela
        function updateMapDisplay(lat, lng) {
            const mapView = document.getElementById('map-view');
            const embedUrl = `https://maps.google.com/maps?q=${lat},${lng}&z=17&output=embed`;
            mapView.innerHTML = `<iframe src="${embedUrl}" style="width:100%; height:100%; border:0;"></iframe>`;
        }

        // Função para enviar os dados ao Google Drive
        async function syncToDrive() {
            if (!isTracking || lastLat === null) return;

            const payload = { lat: lastLat, lng: lastLng };
            
            try {
                // Usamos no-cors para evitar bloqueios de segurança do navegador mobile
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    cache: 'no-cache',
                    body: JSON.stringify(payload)
                });
                timeVal.innerText = new Date().toLocaleTimeString();
                console.log("Payload enviado com sucesso.");
            } catch (e) {
                console.error("Erro na sincronização:", e);
                statusText.innerText = "ERRO DE CONEXÃO";
            }
        }

        // Evento do Botão Principal
        btn.addEventListener('click', () => {
            if (!isTracking) {
                if (!navigator.geolocation) {
                    alert("Seu navegador não suporta GPS.");
                    return;
                }

                isTracking = true;
                btn.innerText = "ENCERRAR RASTREAMENTO";
                btn.classList.add('active');
                dot.classList.add('live');
                statusText.innerText = "BUSCANDO SATÉLITES...";

                // Iniciar monitoramento de posição
                watchID = navigator.geolocation.watchPosition(
                    (p) => {
                        lastLat = p.coords.latitude;
                        lastLng = p.coords.longitude;
                        
                        document.getElementById('lat-val').innerText = lastLat.toFixed(6);
                        document.getElementById('lng-val').innerText = lastLng.toFixed(6);
                        statusText.innerText = "SISTEMA ONLINE";
                        
                        updateMapDisplay(lastLat, lastLng);
                    },
                    (err) => {
                        console.error("Erro GPS:", err);
                        alert("Por favor, ative o GPS e autorize o site.");
                        location.reload();
                    },
                    { enableHighAccuracy: true, timeout: 10000 }
                );

                // Iniciar ciclo de envio a cada 5 segundos
                window.syncInterval = setInterval(syncToDrive, 5000);

            } else {
                // Para o rastreamento e recarrega
                isTracking = false;
                if (watchID) navigator.geolocation.clearWatch(watchID);
                if (window.syncInterval) clearInterval(window.syncInterval);
                location.reload();
            }
        });
    </script>
</body>
</html>
