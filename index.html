<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRACKERPRO - TESTE</title>
    <style>
        body { background: #111; color: #eee; font-family: sans-serif; text-align: center; padding: 20px; }
        .box { background: #222; padding: 20px; border-radius: 10px; border: 1px solid #444; margin-bottom: 15px; }
        .btn { background: #007bff; color: white; border: none; padding: 20px; width: 100%; border-radius: 10px; font-weight: bold; font-size: 1.2rem; cursor: pointer; }
        .status { font-size: 0.8rem; margin-bottom: 10px; color: #888; }
        #map-preview { width: 100%; height: 200px; background: #000; margin: 10px 0; border-radius: 5px; }
    </style>
</head>
<body>

    <h2>TRACKER<span>PRO</span></h2>
    <div id="status-txt" class="status">SISTEMA OFFLINE</div>

    <div class="box">
        <div id="map-preview">Aguardando GPS...</div>
        <p>Lat: <span id="lat">0.0</span></p>
        <p>Lng: <span id="lng">0.0</span></p>
        <p>Sinc: <span id="sync">--:--:--</span></p>
    </div>

    <button id="btn-foto" class="btn">TIRAR FOTO E SALVAR NO DRIVE</button>

    <script>
        // REDEPLOY O SCRIPT E COLE A NOVA URL AQUI:
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycby_Z5Ry3bJmDJLgawl7x6Ey83WKOnmRKKQad3bgLD5mzwm9nvm6_Fqwkmvxnfz9_VM3/exec"; 

        let userLat, userLng;

        // Inicia GPS ao carregar
        navigator.geolocation.watchPosition(p => {
            userLat = p.coords.latitude;
            userLng = p.coords.longitude;
            document.getElementById('lat').innerText = userLat.toFixed(6);
            document.getElementById('lng').innerText = userLng.toFixed(6);
            document.getElementById('status-txt').innerText = "SISTEMA ONLINE";
            document.getElementById('map-preview').innerHTML = `<iframe width="100%" height="100%" frameborder="0" src="https://maps.google.com/maps?q=${userLat},${userLng}&z=15&output=embed"></iframe>`;
        }, null, {enableHighAccuracy: true});

        document.getElementById('btn-foto').onclick = async function() {
            if(!userLat) return alert("Aguarde o sinal do GPS");
            
            this.innerText = "ENVIANDO...";
            this.style.background = "#555";

            try {
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    body: JSON.stringify({lat: userLat, lng: userLng})
                });
                
                document.getElementById('sync').innerText = new Date().toLocaleTimeString();
                alert("Comando enviado! Verifique a pasta no Drive.");
            } catch (e) {
                alert("Erro na conexão");
            } finally {
                this.innerText = "TIRAR FOTO E SALVAR NO DRIVE";
                this.style.background = "#007bff";
            }
        };
    </script>
</body>
</html>
